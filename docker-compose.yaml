services:
  nginx:
    image: nginx:alpine
    container_name: outbox_nginx
    restart: unless-stopped
    tty: true
    volumes:
      - .:/var/www/outbox_app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    networks:
      - laravel
    depends_on:
      - app
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: outbox_app
    volumes:
      - .:/var/www/outbox_app
    environment:
      PHP_IDE_CONFIG: "serverName=outbox-test-ab"
      XDEBUG_MODE: debug
    entrypoint: /usr/local/bin/entrypoint.sh
    command: php-fpm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    networks:
      - laravel
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: scheduler
    working_dir: /var/www/outbox_app
    environment:
      XDEBUG_MODE: off
    command: php artisan schedule:work
    volumes:
      - .:/var/www/outbox_app
    depends_on:
      - app
    networks:
      - laravel
    restart: unless-stopped
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - laravel
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - laravel
volumes:
  pgdata:

networks:
  laravel:
    driver: bridge
